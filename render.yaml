services:
  # FastAPI Backend Service
  - type: web
    name: student-performance-ai-backend
    env: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: student-ai-postgres
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.12.0

databases:
  # Managed PostgreSQL
  - name: student-ai-postgres
    databaseName: student_ai_db
    user: student_ai_user
    plan: free
